<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Md Raghib | AI Personal Assistant</title>
  
  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    /* Reset and Core Variables */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-gradient: radial-gradient(circle at top left, #1e1b4b 0%, #0f172a 40%, #020617 100%);
      --glass-bg: rgba(15, 23, 42, 0.65);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-glow: rgba(99, 102, 241, 0.15);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --bot-bubble: linear-gradient(135deg, rgba(99, 102, 241, 0.25) 0%, rgba(139, 92, 246, 0.25) 100%);
      --bot-border: rgba(139, 92, 246, 0.35);
      --user-bubble: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      --user-border: rgba(255, 255, 255, 0.15);
      
      --accent: #6366f1;
      --accent-glow: 0 0 20px rgba(99, 102, 241, 0.4);
      --pulse-color: #22c55e;
      
      --font-display: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      font-family: var(--font-body);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Container & Layout */
    .chat-container {
      width: 90%;
      max-width: 850px;
      height: 85vh;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Subtle background glow element */
    .chat-container::before {
      content: '';
      position: absolute;
      top: -15%;
      left: -15%;
      width: 50%;
      height: 50%;
      background: var(--accent);
      filter: blur(120px);
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }

    /* Header */
    .chat-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1;
      background: rgba(15, 23, 42, 0.3);
    }

    .bot-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar-wrapper {
      position: relative;
      width: 44px;
      height: 44px;
    }

    .bot-avatar {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      box-shadow: var(--accent-glow);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background-color: var(--pulse-color);
      border-radius: 50%;
      position: absolute;
      bottom: -2px;
      right: -2px;
      border: 2px solid #0f172a;
      box-shadow: 0 0 8px var(--pulse-color);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    .bot-details h1 {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #a5b4fc 0%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .bot-details p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Messages Frame */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 1;
      scroll-behavior: smooth;
    }

    /* Scrollbar styling */
    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }
    .chat-messages::-webkit-scrollbar-track {
      background: transparent;
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.2);
      border-radius: 10px;
    }
    .chat-messages::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.4);
    }

    /* Message Bubbles */
    .message {
      max-width: 75%;
      display: flex;
      gap: 12px;
      animation: fadeInUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .message.bot {
      align-self: flex-start;
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }

    .msg-bubble {
      padding: 12px 18px;
      border-radius: 18px;
      font-size: 0.925rem;
      line-height: 1.5;
      position: relative;
    }

    .bot .msg-bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--bot-border);
      border-top-left-radius: 4px;
      color: #e2e8f0;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.05);
    }

    .user .msg-bubble {
      background: var(--user-bubble);
      border: 1px solid var(--user-border);
      border-top-right-radius: 4px;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.15);
    }

    .msg-bubble strong {
      color: #ffffff;
      font-weight: 600;
    }

    .msg-bubble br {
      margin-bottom: 6px;
    }

    /* Suggestion Chips */
    .suggestion-chips {
      display: flex;
      gap: 8px;
      padding: 8px 24px;
      overflow-x: auto;
      white-space: nowrap;
      z-index: 1;
      scrollbar-width: none; /* Firefox */
    }

    .suggestion-chips::-webkit-scrollbar {
      display: none; /* Safari/Chrome */
    }

    .chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 50px;
      color: var(--text-muted);
      padding: 8px 16px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .chip:hover {
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.3);
      color: var(--text-main);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.1);
    }

    /* Typing Indicator */
    .typing-indicator {
      display: none;
      align-items: center;
      gap: 4px;
      padding: 14px 20px;
      background: var(--bot-bubble);
      border: 1px solid var(--bot-border);
      border-radius: 18px;
      border-top-left-radius: 4px;
      align-self: flex-start;
      margin-left: 44px;
      margin-bottom: 8px;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.05);
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background: #8b5cf6;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Input Frame */
    .chat-input-area {
      padding: 16px 24px 24px 24px;
      border-top: 1px solid var(--glass-border);
      z-index: 1;
      background: rgba(15, 23, 42, 0.2);
    }

    .input-wrapper {
      display: flex;
      gap: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      padding: 6px;
      border-radius: 16px;
      align-items: center;
      transition: all 0.3s ease;
    }

    .input-wrapper:focus-within {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.04);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.15);
    }

    .input-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.95rem;
      padding: 10px 14px;
      font-family: var(--font-body);
    }

    .input-wrapper input::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      background: var(--accent);
      border: none;
      outline: none;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: var(--accent-glow);
    }

    .send-btn:hover {
      transform: translateY(-2px) scale(1.05);
      background: #4f46e5;
    }

    .send-btn:active {
      transform: translateY(0) scale(0.95);
    }

    .send-btn svg {
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      width: 20px;
      height: 20px;
      transform: translate(1px, -1px);
    }

    /* Image Card Styles */
    .image-container {
      margin-top: 12px;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      max-width: 100%;
    }

    .generated-image {
      width: 100%;
      max-height: 350px;
      object-fit: cover;
      display: block;
      opacity: 0;
      animation: fadeInImage 0.5s ease-out forwards;
    }

    @keyframes fadeInImage {
      from { opacity: 0; filter: blur(5px); }
      to { opacity: 1; filter: blur(0); }
    }

    .image-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(15, 23, 42, 0.85));
      padding: 12px;
      display: flex;
      justify-content: flex-end;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .image-container:hover .image-overlay {
      opacity: 1;
    }

    .download-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .download-btn:hover {
      background: var(--accent);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-1px);
    }

    /* Media Queries */
    @media (max-width: 600px) {
      .chat-container {
        height: 100vh;
        width: 100vw;
        border-radius: 0;
        border: none;
      }
      body {
        padding: 0;
      }
      .message {
        max-width: 85%;
      }
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <!-- Header -->
    <header class="chat-header">
      <div class="bot-info">
        <div class="avatar-wrapper">
          <svg class="bot-avatar" width="44" height="44" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="20" r="20" fill="url(#bot-grad)"/>
            <path d="M20 9C15.03 9 11 13.03 11 18C11 20.31 11.88 22.42 13.31 24.03C13.74 24.51 14 25.13 14 25.78V28C14 29.1 14.9 30 16 30H24C25.1 30 26 29.1 26 28V25.78C26 25.13 26.26 24.51 26.69 24.03C28.12 22.42 29 20.31 29 18C29 13.03 24.97 9 20 9Z" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M17 17H17.01M23 17H23.01" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M17 21.5C18 22.5 22 22.5 23 21.5" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
            <defs>
              <linearGradient id="bot-grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                <stop stop-color="#6366f1"/>
                <stop offset="1" stop-color="#d946ef"/>
              </linearGradient>
            </defs>
          </svg>
          <div class="status-dot"></div>
        </div>
        <div class="bot-details">
          <h1>Md Raghib's AI Bot</h1>
          <p>Answers queries about Md Raghib's portfolio & background</p>
        </div>
      </div>
    </header>

    <!-- Main Message Stream -->
    <main class="chat-messages" id="chatMessages">
      <div class="message bot">
        <div class="msg-avatar">
          <svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="20" r="20" fill="url(#bot-grad-sm)"/>
            <path d="M20 9C15.03 9 11 13.03 11 18C11 20.31 11.88 22.42 13.31 24.03C13.74 24.51 14 25.13 14 25.78V28C14 29.1 14.9 30 16 30H24C25.1 30 26 29.1 26 28V25.78C26 25.13 26.26 24.51 26.69 24.03C28.12 22.42 29 20.31 29 18C29 13.03 24.97 9 20 9Z" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M17 17H17.01M23 17H23.01" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M17 21.5C18 22.5 22 22.5 23 21.5" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
            <defs>
              <linearGradient id="bot-grad-sm" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                <stop stop-color="#6366f1"/>
                <stop offset="1" stop-color="#d946ef"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="msg-bubble">
          Hi! 👋 I am Md Raghib's AI chatbot. Ask me about my skills, projects, work experience, education, or contact details, and I'll do my best to help!
        </div>
      </div>
    </main>

    <!-- Typing Indicator -->
    <div class="typing-indicator" id="typingIndicator">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>

    <!-- Suggestion Chips -->
    <div class="suggestion-chips">
      <button class="chip" onclick="askPreset('Generate a random image')">Generate Image 🎨</button>
      <button class="chip" onclick="askPreset('What are your skills?')">Skills 🛠️</button>
      <button class="chip" onclick="askPreset('Show me your recent projects')">Projects 🚀</button>
      <button class="chip" onclick="askPreset('Tell me about your work experience')">Experience 💼</button>
      <button class="chip" onclick="askPreset('Where did you study?')">Education 🎓</button>
      <button class="chip" onclick="askPreset('What are your hobbies?')">Hobbies 🎨</button>
      <button class="chip" onclick="askPreset('How can I contact you?')">Contact 📞</button>
    </div>

    <!-- Input Footer -->
    <footer class="chat-input-area">
      <div class="input-wrapper">
        <input type="text" id="userInput" placeholder="Ask a question..." autocomplete="off" onkeydown="handleKeydown(event)">
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- Client JavaScript -->
  <script>
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const typingIndicator = document.getElementById('typingIndicator');

    // Basic Markdown Parser (converts **bold** and newlines to tags)
    function parseMarkdown(text) {
      // Escape HTML injection
      let cleanText = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      // Replace bold syntax **text**
      cleanText = cleanText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      // Replace lists (simple bullets)
      cleanText = cleanText.replace(/^- (.*)$/gm, '&bull; $1');
      // Replace newlines with <br>
      cleanText = cleanText.replace(/\n/g, '<br>');
      
      return cleanText;
    }

    function appendMessage(sender, text, imageDataUrl = null) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);

      const avatarDiv = document.createElement('div');
      avatarDiv.classList.add('msg-avatar');

      let avatarSvg = '';
      if (sender === 'bot') {
        avatarSvg = `
          <svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="20" r="20" fill="url(#b-grad)"/>
            <path d="M20 9C15.03 9 11 13.03 11 18C11 20.31 11.88 22.42 13.31 24.03C13.74 24.51 14 25.13 14 25.78V28C14 29.1 14.9 30 16 30H24C25.1 30 26 29.1 26 28V25.78C26 25.13 26.26 24.51 26.69 24.03C28.12 22.42 29 20.31 29 18C29 13.03 24.97 9 20 9Z" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M17 17H17.01M23 17H23.01" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M17 21.5C18 22.5 22 22.5 23 21.5" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
            <defs>
              <linearGradient id="b-grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                <stop stop-color="#6366f1"/>
                <stop offset="1" stop-color="#d946ef"/>
              </linearGradient>
            </defs>
          </svg>`;
      } else {
        avatarSvg = `
          <svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="20" r="20" fill="url(#u-grad)"/>
            <path d="M20 20C23.3137 20 26 17.3137 26 14C26 10.6863 23.3137 8 20 8C16.6863 8 14 10.6863 14 14C14 17.3137 16.6863 20 20 20Z" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10 30C10 25.5817 14.4772 22 20 22C25.5228 22 30 25.5817 30 30" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="u-grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                <stop stop-color="#3b82f6"/>
                <stop offset="1" stop-color="#06b6d4"/>
              </linearGradient>
            </defs>
          </svg>`;
      }

      avatarDiv.innerHTML = avatarSvg;

      const bubbleDiv = document.createElement('div');
      bubbleDiv.classList.add('msg-bubble');
      bubbleDiv.innerHTML = parseMarkdown(text);

      if (imageDataUrl) {
        const imgContainer = document.createElement('div');
        imgContainer.classList.add('image-container');
        imgContainer.innerHTML = `
          <img src="${imageDataUrl}" alt="Generated Image" class="generated-image" />
          <div class="image-overlay">
            <a href="${imageDataUrl}" download="generated-image.png" class="download-btn" title="Download Image">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              Download
            </a>
          </div>
        `;
        bubbleDiv.appendChild(imgContainer);
      }

      msgDiv.appendChild(avatarDiv);
      msgDiv.appendChild(bubbleDiv);
      chatMessages.appendChild(msgDiv);
      
      // Auto scroll
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showTyping(show) {
      typingIndicator.style.display = show ? 'flex' : 'none';
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      userInput.value = '';
      appendMessage('user', text);

      // Show typing indicator
      showTyping(true);

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ message: text })
        });
        
        const data = await response.json();
        
        // Mock a natural delay for bot response
        setTimeout(() => {
          showTyping(false);
          appendMessage('bot', data.response || "Sorry, I encountered an error processing that question.", data.image);
        }, 550);

      } catch (err) {
        showTyping(false);
        appendMessage('bot', "Error: Could not establish connection to the assistant server.");
      }
    }

    function handleKeydown(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    }

    function askPreset(question) {
      userInput.value = question;
      sendMessage();
    }
  </script>
</body>
</html>
